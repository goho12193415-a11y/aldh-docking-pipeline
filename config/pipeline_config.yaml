project:
  name: ALDH_Docking_Pipeline
  output_root: .
  log_level: INFO

safety:
  strict_capability_gate: true
  experimental_ph: 7.4
  auto_remediate_chemical_state: true

vina:
  executable: "vina"
  exhaustiveness: 16
  num_modes: 20
  energy_range: 4.0

receptor:
  input_pdb: "data/01_raw_receptors/receptor.pdb"
  template_pdb: null
  chain_id: A
  cofactor_chain: A
  keep_cofactors: [NAD, NAP, NDP]
  catalytic_residue:
    name: CYS
    number: 302
    chain: A
  oxyanion_residue:
    name: ASN
    number: 169
    atom: ND2

enzyme:
  mechanism_family: aldh
  requires_cofactor: true
  mechanism: "catalytic cysteine oxidation of aldehyde substrate"
  flexible_residues: []
  conserved_waters: []

docking_box:
  size_x: 18.0
  size_y: 18.0
  size_z: 18.0
  offset_outward: 2.0
  center_mode: midpoint_if_cofactor
  candidates: []

ligands:
  - name: Hexanal
    smiles: "CCCCC=O"
  - name: Nonanal
    smiles: "CCCCCCCC=O"
  - name: Octanal
    smiles: "CCCCCCC=O"

thresholds:
  carbonyl_bond_min: 1.15
  carbonyl_bond_max: 1.35
  d_nuc_min: 3.0
  d_nuc_max: 4.5
  d_hyd_max: 4.5
  d_oxy_max: 5.0
  adaptive_cofactor_hydride_max: true
  hydrogen_bond_max: 3.5
  hydrophobic_min: 3.3
  hydrophobic_max: 4.0

visualization:
  pymol_executable: "pymol"
  render_png: true
  png_width: 2400
  png_height: 1800
  png_dpi: 300

advanced:
  auto_detect_catalytic_cys: false
  auto_configure_receptor: true
  motif_patterns:
    - "[FY].{1,3}[GAQ].{0,2}C"
    - "[LIVMF].{2,5}C"
  ligand_variants:
    enabled: true
    max_variants: 8
    dock_variants: false
  polysaccharide:
    enabled: true
    conformer_count: 24
    rmsd_threshold: 0.5
    dock_conformer_ensemble: true
  receptor_ensemble:
    enabled: false
    inputs: []
  replicates:
    count: 1
    seeds: [101, 202, 303]
  plip:
    enabled: false
    executable: plip
  md:
    enabled: false
    engine: gromacs
    steps: 5000000
    temperature_K: 298.15
  qmmm:
    enabled: false
    charge: 0
    multiplicity: 1
    qm_residues: [CYS302, NAD5501]
  covalent:
    enabled: false
  engines: [vina]
  evaluation:
    enabled: false
    experimental_csv: "data/experimental_activity.csv"
